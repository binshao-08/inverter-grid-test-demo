<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>逆变器并网测试数据整理工具 · 作品集</title>
<style>
  :root { color-scheme:light; --ink:#152b33; --muted:#456069; --line:#d5e4e5; --accent:#006052; --soft:#e5f6ef; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f1f6f5; color:var(--ink); font:16px/1.6 system-ui,-apple-system,sans-serif; }
  header { background:#122b31; color:#f3fffa; padding:clamp(24px,4vw,48px) 0; }
  header > div, main { width:min(1040px,calc(100% - 32px)); margin:auto; }
  .eyebrow { color:#a3dfce; font-size:.83rem; font-weight:700; letter-spacing:.1em; }
  h1 { font-size:clamp(1.8rem,4.4vw,3rem); line-height:1.18; margin:.25em 0; letter-spacing:-.03em; }
  header p { color:#d4e9e4; max-width:45rem; }
  main { padding:20px 0 36px; }
  .card { background:white; border:1px solid var(--line); border-radius:16px; padding:clamp(14px,3vw,26px); margin-bottom:14px; box-shadow:0 8px 24px #183a320b; }
  h2 { margin:0 0 .35em; font-size:1.22rem; }
  p { margin:.4em 0; }
  .muted, .legend { color:var(--muted); font-size:.92rem; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  button { border:1px solid var(--accent); padding:.48em .78em; border-radius:7px; background:var(--accent); color:white; font:inherit; font-weight:650; cursor:pointer; }
  button:hover:not(:disabled) { background:#004c41; color:white; }
  button.secondary { background:white; color:var(--accent); }
  button:disabled { opacity:.55; cursor:default; }
  :focus-visible { outline:3px solid #b16411; outline-offset:3px; }
  input { font:inherit; color:var(--ink); max-width:100%; }
  input[type=file] { display:block; margin:5px 0 0; width:100%; }
  label { display:block; font-weight:650; }
  form { margin:0; }
  .settings { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 14px; }
  .settings input { width:100%; min-width:0; border:1px solid #93adae; border-radius:6px; padding:6px 8px; background:#fcfefe; }
  .field { display:flex; flex-direction:column; gap:3px; }
  .file-note { margin-top:9px; overflow-wrap:anywhere; }
  #status { padding:10px 12px; border-radius:8px; background:#edf7f6; }
  #status[data-kind=warn] { background:#fff4de; color:#755112; }
  #status[data-kind=error] { background:#fff0ea; color:#8c2e10; }
  .bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .bar h2 { margin:0; }
  figure { margin:12px 0; }
  svg { display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:9px; background:#f7fbfa; }
  .legend span { display:inline-block; margin-right:13px; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px; }
  .table-scroll { overflow-x:auto; }
  table { width:100%; min-width:660px; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  caption { text-align:left; font-weight:700; padding:4px 0 5px; }
  th, td { padding:.48em .42em; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child { text-align:left; }
  thead th { color:var(--muted); font-size:.88rem; }
  .tag { display:inline-block; padding:.04em .48em; border-radius:5px; background:var(--soft); color:#005447; font-weight:700; white-space:nowrap; }
  .tag[data-kind=fail] { background:#ffefe6; color:#8c2e10; }
  .tag[data-kind=pending] { background:#fff4de; color:#755112; }
  footer { color:var(--muted); font-size:.9rem; }
  @media(max-width:720px) { .settings { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
</head>
<body>
<header><div>
  <div class="eyebrow">测试数据自动化 / 作品集</div>
  <h1>逆变器并网测试数据整理工具</h1>
  <p>把有功功率录波切成工况，标出取样范围，再核对目标值。工况数对不上时，保留测量结果供复核。</p>
</div></header>
<main>
<section class="card" aria-labelledby="input-heading">
  <h2 id="input-heading">1. 加载录波数据</h2>
  <label for="file">导入 CSV</label>
  <input id="file" type="file" accept=".csv,text/csv" aria-describedby="file-help">
  <p class="muted" id="file-help">UTF-8，表头 <code>time_s,power_w</code>，时间严格递增，最多 5,000 个测点。数据只在浏览器内处理。</p>
  <div class="actions">
    <button id="sample-normal" class="secondary" type="button">加载正常样例</button>
    <button id="sample-missing" class="secondary" type="button">加载缺工况样例</button>
    <button id="download-sample" class="secondary" type="button">下载当前虚构样例 CSV</button>
  </div>
  <p class="file-note muted" id="source"></p>
</section>
<section class="card" aria-labelledby="config-heading">
  <h2 id="config-heading">2. 设置分段、取样和目标</h2>
  <form id="settings">
    <div class="settings">
      <div class="field"><label for="split-jump">跳变阈值（W）</label><input id="split-jump" type="number" step="any" min="0" max="2000000000" value="15" required></div>
      <div class="field"><label for="window-count">每段取最后 N 点</label><input id="window-count" type="number" step="1" min="1" max="5000" value="2" required></div>
      <div class="field"><label for="targets">目标值（逗号分隔，W）</label><input id="targets" type="text" maxlength="2000" value="60,90,120" required></div>
      <div class="field"><label for="tolerance">允许偏差（±W）</label><input id="tolerance" type="number" step="any" min="0" max="2000000000" value="3" required></div>
    </div>
    <p class="muted">相邻测点功率差超过阈值时切段。样例第三段偏差为 +6 W，可试着把容差从 5 改到 6 再计算。</p>
    <div class="actions"><button id="run" type="submit">计算工况汇总</button></div>
  </form>
</section>
<section class="card" aria-labelledby="result-heading">
  <div class="bar"><h2 id="result-heading">3. 复核结果并导出</h2><button id="export" type="button" disabled>下载汇总 CSV</button></div>
  <p id="status" role="status"></p>
  <figure id="plot" hidden>
    <svg id="chart" viewBox="0 0 760 225" role="img" aria-label="按时间绘制的实测功率曲线、各段取样范围和已匹配的目标值"></svg>
    <figcaption class="legend"><span><i style="background:#006052"></i>实测功率</span><span><i style="background:#bde9d7"></i>取样窗口</span><span><i style="background:#9a591c"></i>目标值（虚线）</span><span>灰线为分段边界</span></figcaption>
  </figure>
  <div id="table-wrap" class="table-scroll" tabindex="0" aria-label="工况结果表，可横向滚动" hidden>
    <table>
      <caption id="summary"></caption>
      <thead><tr><th scope="col">工况</th><th scope="col">工况区间（s）</th><th scope="col">取样区间（s）</th><th scope="col">均值（W）</th><th scope="col">目标（W）</th><th scope="col">偏差（W）</th><th scope="col">判定</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>
</section>
<footer>这是独立实现的作品集工具。内置样例均为虚构数据，示例阈值不代表任何检测标准。</footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  const normal = [59,60,60,61,88,89,90,91,124,125,126,126].map((v,t)=>({t,v}));
  const examples = { normal, missing:normal.filter(({t})=>t<4 || t>=8) };
  const maxRows = 5000;
  const maxValue = 1e9;
  let data = null, results = null, sample = 'normal', importToken = 0;

  function num(text) {
    const s=text.trim();
    const parsed=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(s) ? Number(s) : NaN;
    return Math.abs(parsed) <= maxValue ? parsed : NaN;
  }

  function parseCsv(text) {
    const lines=text.replace(/^\ufeff/,'').trimEnd().split(/\r\n|\n|\r/);
    // ponytail: Only two scalar columns are supported; a general CSV parser is unnecessary for this contract.
    const cells=line=>line.split(',').map(v=>v.trim().replace(/^"([^"]*)"$/,'$1').trim());
    if (cells(lines[0]).join(',')!=='time_s,power_w') throw Error('表头应为 time_s,power_w。');
    if (lines.length<2 || lines.length>maxRows+1) throw Error('CSV 需要 1 到 5,000 条数据。');
    let last=-Infinity;
    return lines.slice(1).map((line,i)=>{
      const cols=cells(line);
      const [t,v]=cols.map(num);
      if(cols.length!==2 || !Number.isFinite(t) || !Number.isFinite(v) || t<0) throw Error(`第 ${i+2} 行：需要两列有效数值，时间不得为负。绝对值上限 10 亿。`);
      if(t<=last) throw Error(`第 ${i+2} 行：时间必须严格递增。`);
      last=t;
      return {t,v};
    });
  }

  function clearResults(message,kind='') {
    results=null;
    $('results').replaceChildren();
    $('summary').textContent='';
    $('chart').replaceChildren();
    $('plot').hidden=$('table-wrap').hidden=true;
    $('export').disabled=true;
    status(message,kind);
  }

  function status(message,kind='') {
    $('status').textContent=message;
    $('status').dataset.kind=kind;
  }

  const print=n=>n==null ? '—' : String(Number(n.toPrecision(10)));
  const range=(a,b)=>`${print(a)}–${print(b)}`;

  function summarize(points,jump,windowCount,targets,tolerance) {
    const starts=[0];
    for(let i=1;i<points.length;i++) if(Math.abs(points[i].v-points[i-1].v)>jump) starts.push(i);
    const matched=starts.length===targets.length;
    return starts.map((start,i)=>{
      const end=(starts[i+1]??points.length)-1;
      const first=Math.max(start,end-windowCount+1);
      const count=end-first+1;
      const average=points.slice(first,end+1).reduce((sum,p)=>sum+p.v,0)/count;
      // ponytail: Match by input order only when counts agree; without event IDs we cannot guess missing steps.
      const target=matched ? targets[i] : null;
      const enough=count===windowCount;
      const delta=matched && enough ? average-target : null;
      const verdict=delta===null ? '待复核' : Math.abs(delta)<=tolerance ? '通过' : '超出';
      const reason=!matched ? '工况数不匹配' : !enough ? '取样点不足' : '';
      return {start,end,first,count,average,target,delta,verdict,reason,tolerance};
    });
  }

  function calculate() {
    if(!data) return;
    if(!$('settings').reportValidity()) { clearResults('请填写有效的分析参数。','error'); return; }
    const targets=$('targets').value.split(/[,，]/).map(num);
    if(targets.length>100 || targets.some(v=>!Number.isFinite(v))) {
      clearResults('请用逗号分隔目标值，最多 100 个有效数值，绝对值上限 10 亿。','error'); return;
    }
    const rows=summarize(data,+$('split-jump').value,+$('window-count').value,targets,+$('tolerance').value);
    const aligned=rows.length===targets.length;
    if(!aligned) status(`工况数不匹配：识别出 ${rows.length} 段，有 ${targets.length} 个目标值。全部标为待复核，不自动配对。`,'warn');
    else {
      const short=rows.filter(r=>r.reason==='取样点不足').length;
      status('段数一致，按输入顺序配对；请结合曲线确认工况顺序。'+(short ? ` ${short} 段取样点不足，已标待复核。` : ''),short ? 'warn' : '');
    }
    results=rows;
    $('summary').textContent=`${rows.length} 段 · ${rows.filter(r=>r.verdict==='通过').length} 通过 · ${rows.filter(r=>r.verdict==='超出').length} 超出 · ${rows.filter(r=>r.verdict==='待复核').length} 待复核`;
    $('results').innerHTML=rows.map((r,i)=>`<tr><th scope="row">${i+1}</th><td>${range(data[r.start].t,data[r.end].t)}</td><td>${range(data[r.first].t,data[r.end].t)}（${r.count} 点）</td><td>${print(r.average)}</td><td>${print(r.target)}</td><td>${r.delta>0?'+':''}${print(r.delta)}</td><td><span class="tag" data-kind="${r.verdict==='待复核'?'pending':r.verdict==='超出'?'fail':'pass'}">${r.verdict}</span>${r.reason?`<br><small>${r.reason}</small>`:''}</td></tr>`).join('');
    drawChart(data,rows);
    $('plot').hidden=$('table-wrap').hidden=false;
    $('export').disabled=false;
  }

  function drawChart(points,rows) {
    const first=points[0].t, last=points.at(-1).t;
    const values=[...points.map(p=>p.v),...rows.map(r=>r.target).filter(v=>v!==null)];
    const low=Math.min(...values), high=Math.max(...values), pad=Math.max(1,(high-low)*.1);
    const x=t=>58+674*(t-first)/(last-first||1);
    const y=v=>175-145*(v-low+pad)/(high-low+2*pad);
    const coordinate=n=>n.toFixed(2);
    const ticks=Array.from({length:5},(_,i)=>low-pad+(high-low+2*pad)*i/4);
    const path=points.map(({t,v})=>`${coordinate(x(t))},${coordinate(y(v))}`).join(' ');
    const marks=rows.map((r,i)=>{
      const left=x(points[r.first].t), right=x(points[r.end].t);
      const start=x(points[r.start].t);
      const boundary=i? (x(points[r.start-1].t)+start)/2 : 58;
      return `<rect x="${Math.max(56,left-2)}" y="28" width="${Math.max(4,right-left+4)}" height="149" fill="#bde9d7" opacity=".7"/>
        ${i?`<line x1="${boundary}" x2="${boundary}" y1="28" y2="177" stroke="#8c9f9f" stroke-dasharray="2 4"/>`:''}
        ${r.target!==null?`<line x1="${start-2}" x2="${right+2}" y1="${y(r.target)}" y2="${y(r.target)}" stroke="#9a591c" stroke-width="2" stroke-dasharray="6 4"/>`:''}
        ${rows.length<=12?`<text x="${(start+right)/2}" y="193" text-anchor="middle">段 ${i+1}</text>`:''}`;
    }).join('');
    $('chart').innerHTML=`<g fill="#456069" font-size="13">
      <text x="44" y="17" text-anchor="end">W</text>
      ${ticks.map(v=>`<line x1="56" x2="736" y1="${y(v)}" y2="${y(v)}" stroke="#d5e4e5"/><text x="50" y="${y(v)+4}" text-anchor="end">${Number(v.toPrecision(4))}</text>`).join('')}
      ${marks}<polyline points="${path}" fill="none" stroke="#006052" stroke-width="2.4" stroke-linejoin="round"/>
      ${points.length<=75?points.map(({t,v})=>`<circle cx="${x(t)}" cy="${y(v)}" r="3" fill="#006052" stroke="white"/>`).join(''):''}
      <text x="58" y="212">${print(first)} s</text><text x="732" y="212" text-anchor="end">${print(last)} s</text></g>`;
  }

  function useSample(key) {
    importToken++;
    sample=key;
    data=examples[key];
    $('file').value='';
    $('run').disabled=false;
    $('source').textContent=`已加载${key==='normal'?'正常样例':'缺工况样例'} · ${data.length} 个虚构测点`;
    calculate();
  }

  $('sample-normal').addEventListener('click',()=>useSample('normal'));
  $('sample-missing').addEventListener('click',()=>useSample('missing'));
  $('file').addEventListener('change',async ()=>{
    const file=$('file').files[0];
    if(!file) return;
    const token=++importToken;
    data=null;
    $('run').disabled=true;
    $('source').textContent='正在读取：'+file.name;
    clearResults('正在读取 CSV。');
    try {
      if(file.size>512*1024) throw Error('CSV 不得超过 512 KB。');
      const contents=await file.arrayBuffer();
      if(token!==importToken) return;
      let value;
      try { value=new TextDecoder('utf-8',{fatal:true}).decode(contents); }
      catch { throw Error('请将 CSV 保存为 UTF-8 编码。'); }
      data=parseCsv(value);
    } catch(error) {
      if(token===importToken) {
        $('source').textContent='导入失败：'+file.name;
        clearResults(error.message,'error');
        $('file').value='';
      }
      return;
    }
    $('source').textContent=`已导入：${file.name} · ${data.length} 个测点`;
    $('run').disabled=false;
    calculate();
  });

  $('settings').addEventListener('input',()=>{if(data) clearResults('参数已修改，请重新计算。');});
  $('settings').addEventListener('submit',e=>{e.preventDefault(); calculate();});

  function download(name,rows) {
    const blob=new Blob(['\ufeff',rows.map(cols=>cols.join(',')).join('\r\n'),'\r\n'],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=name;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  $('download-sample').addEventListener('click',()=>download(`synthetic-${sample}.csv`,[['time_s','power_w'],...examples[sample].map(({t,v})=>[t,v])]));
  $('export').addEventListener('click',()=>{
    if(!results) return;
    download('segment-summary.csv',[
      ['segment','segment_start_s','segment_end_s','sample_start_s','sample_end_s','sample_points','mean_w','target_w','deviation_w','tolerance_w','status','reason'],
      ...results.map((r,i)=>[i+1,data[r.start].t,data[r.end].t,data[r.first].t,data[r.end].t,r.count,r.average,r.target,r.delta,r.tolerance,r.verdict,r.reason])
    ]);
  });
  useSample('normal');
</script>
</body>
</html>
